<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f4">
<title>Employee Relations Automation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23b8141f'/%3E%3Cpath d='M11 13a3 3 0 1 0 0-.01M21 13a3 3 0 1 0 0-.01M6 24c0-3 2.5-5 5-5s5 2 5 5M16 24c0-3 2.5-5 5-5s5 2 5 5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<!-- Applies the saved light/dark choice before the page paints (no flash) -->
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/styles.css">
<!-- Visual theme (colours, type, layout polish). Remove this line to get the original v39 look back. -->
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.3c.6-.2 1.3-.3 2-.3 2.8 0 5 2.2 5 5"/></svg></span>
      <div><h1>Employee Relations Automation</h1><small>Cases · PIPs · EmployeeVoice · Appeals</small></div>
    </div>

    <section class="rolebar" aria-label="Switch role">
      <span class="eyebrow">Viewing as</span>
      <div class="roles" id="roles"></div>
      <div class="who-line" id="whoLine"></div>
    </section>

    <div class="topright"><div class="theme-switch" id="themeSwitch" role="group" aria-label="Colour theme">
        <button type="button" data-theme-set="light" aria-pressed="false" title="Light mode"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Light</span></button>
        <button type="button" data-theme-set="dark" aria-pressed="false" title="Dark mode"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Dark</span></button>
        <button type="button" data-theme-set="auto" aria-pressed="false" title="Follow device setting"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>Auto</span></button>
      </div><span class="proto">PROTOTYPE · sample data only</span><button type="button" class="btn sm" id="resetData" title="Clear saved changes and reload the sample data">Reset sample data</button></div>
  </header>

  <div id="main"></div>

</div>

<!-- jsPDF builds the notice and record PDFs in the browser -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- Load order matters: config, then data, then platform services, then the app -->
<script src="js/config.js"></script>
<script src="data/sample-data.js"></script>
<script src="js/platform.js"></script>
<script src="js/app.js"></script>
</body>
</html>
